name: Scout voiceovers (ElevenLabs)

on:
  push:
    branches: [main]
    paths: ["vo/requests/**", "tts.py", ".github/workflows/voiceover.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: voiceover
  cancel-in-progress: false

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate voiceovers
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python tts.py
      - name: Commit results back to the repo
        run: |
          git config user.name "scout-voiceover-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vo/out
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Voiceover output [skip ci]"
          git pull --rebase origin main
          git push
